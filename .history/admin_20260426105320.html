<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coffee Bliss Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="dashboard">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>☕ Bliss</h2>
    <ul>
      <li class="active">Dashboard</li>
      <li>Orders</li>
      <li>Products</li>
      <li>Customers</li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main">

    <!-- Topbar -->
    <div class="topbar">
      <h2>Admin Dashboard</h2>
      <input type="text" placeholder="Search...">
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="card">Total Orders <h3 id="totalOrders">0</h3></div>
      <div class="card">Revenue <h3 id="totalRevenue">₹0</h3></div>
      <div class="card">Pending <h3 id="pendingOrders">0</h3></div>
    </div>

    <!-- Orders Table -->
    <div class="orders">
      <h3>Recent Orders</h3>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Items</th>
            <th>Total</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="orderTable"></tbody>
      </table>
    </div>

  </main>

</div>

<script src="admin.js"></script>
</body>
</html>
