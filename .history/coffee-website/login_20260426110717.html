<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      background: #F5EFEA;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    button {
      padding: 10px;
      width: 100%;
      background: #8B5E3C;
      color: white;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Login</h2>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
</div>

<script>
function login() {
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  // 🔐 Admin login
  if (user === "admin" && pass === "1234") {
    localStorage.setItem("role", "admin");
    window.location.href = "admin.html";
  }

  // 👤 User login
  else if (user && pass) {
    localStorage.setItem("role", "user");
    window.location.href = "index.html";
  }

  else {
    alert("Invalid login ❌");
  }
}
</script>

</body>
</html>
